name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @lead-agent/web test
      - name: API tests with coverage (thresholds in vitest.config.ts)
        run: pnpm --filter @lead-agent/api test:coverage
      - name: Eval on the demo mock (must pass every case)
        run: pnpm eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API and web images
        run: docker compose build
